name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres: # integration tests need real Postgres (unique keys, advisory locks) — P1 D12
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      # Non-secret values: PayPal and the LLM are mocked; the DB is the throwaway service above.
      APP_ENV: test
      PAYPAL_BASE_URL: https://api-m.sandbox.paypal.com
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      REQUIRE_TEST_DB: "1" # db tests fail instead of skipping
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q -rs # -rs lists skipped tests, so a skipped db test is visible

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx next typegen # generates next-env.d.ts + route types (git-ignored)
      - run: npx tsc --noEmit
      - run: npm run lint
